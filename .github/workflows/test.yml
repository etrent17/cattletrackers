# Runs the unit, API and browser tests on every push and pull request.
name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit, API and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cattle_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cattle_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The tests empty this database; see test/helpers/api.js
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/cattle_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          # Chromium is installed explicitly below
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Unit and API tests
        run: npm test

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser smoke test
        run: npm run test:e2e
