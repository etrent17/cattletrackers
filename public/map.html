<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Map - Cattle Trackers</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.css">
  <style>#map { height: 70vh; min-height: 360px; }</style>
</head>
<body>
  <nav class="navbar navbar-dark bg-dark px-3">
    <span class="navbar-brand mb-0 h1">Cattle Trackers</span>
    <a class="btn btn-outline-light btn-sm" href="/">Back to the app</a>
  </nav>
  <main class="container-fluid py-4">
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3">
      <div>
        <h2 class="mb-0">Farm Map</h2>
        <p class="text-muted mb-0">Prototype. Use the polygon tool at the top left of the map to draw a boundary, and the edit and trash tools to change or remove one.</p>
      </div>
      <div class="d-flex flex-wrap gap-2">
        <button id="locate-btn" type="button" class="btn btn-outline-secondary">Find my location</button>
        <button id="clear-btn" type="button" class="btn btn-outline-danger" disabled>Remove all boundaries</button>
      </div>
    </div>
    <div id="map" class="rounded border"></div>
    <p id="map-status" class="small text-muted mt-2 mb-0" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet-draw@1.0.4/dist/leaflet.draw.js"></script>
  <script type="module" src="/map.js"></script>
</body>
</html>
